<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cozy Cups</title>
    <link rel="stylesheet" href="style.css" />
    <style></style>
  </head>
  <body>
    <header>
      <h1>Cozy Cups</h1>
    </header>

    <nav>
      <ul>
        <li>Iced Latte</li>
        <li>Soft Cutlets</li>
        <li>Crunch Sandwich</li>
        <li>Morning Cake</li>
        <li>Sweet Biscuits</li>
      </ul>
    </nav>

    <main class="food">
      <article class="food_list">
        <img src="Iced Latte.jpg" alt="Iced Latte" />
        <h5>Iced Latte</h5>
        <form>
          <label for="size1" class="cl1">Choose size:</label>
          <select name="Size" id="size1">
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
          </select>
          <button type="submit">Order</button>
        </form>
      </article>

      <article class="food_list">
        <img src="Soft Cuttlets.jpg" alt="Soft Cutlets" />
        <h5>Cutlets</h5>
        <form>
          <label for="size2" class="cl2">Choose size:</label>
          <select name="Size" id="size2">
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
          </select>
          <button type="submit">Order</button>
        </form>
      </article>

      <article class="food_list">
        <img src="Ssandwich.jpg" alt="Crunch Sandwich" />
        <h5>Sandwich</h5>
        <form>
          <label for="size3" class="cl3">Choose size:</label>
          <select name="Size" id="size3">
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
          </select>
          <button type="submit">Order</button>
        </form>
      </article>

      <article class="food_list">
        <img src="Morning Cake.jpg" alt="Morning Cake" />
        <h5>Morning Cake</h5>
        <form>
          <label for="size4" class="cl4">Choose size:</label>
          <select name="Size" id="size4">
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
          </select>
          <button type="submit">Order</button>
        </form>
      </article>

      <article class="food_list">
        <img src="Biscuits.jpg" alt="Sweet Biscuits" />
        <h5>Crunchy Biscuits</h5>
        <form>
          <label for="size5" class="cl5">Choose size:</label>
          <select name="Size" id="size5">
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
          </select>
          <button type="submit">Order</button>
        </form>
      </article>
    </main>
  </body>
</html>
